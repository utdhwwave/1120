 g+=f.icons.map(([t,x,y])=>ICON[t](x,y)).join("");
 return `<figure class="fp fp-${k}"><svg viewBox="${vx} ${vy} ${vw} ${vh}" role="img" aria-label="${f.label}平面圖">${g}</svg><figcaption><b>${k}</b>${f.label.slice(2)}</figcaption></figure>`;}
const USED=["C310c","C310d","D301","C316b","C316a","C313","C312","C311b","D302","D307","D308","D309","D310"];
function drawFloor(loc){
 const on=(loc.match(/[CD]\d{3}[a-z]?/g)||[]);
 if(!$("floor").dataset.built){$("floor").innerHTML=fpSVG("C")+fpSVG("D")+`<div class="legend"><span class="k u"></span>評鑑使用<span class="k o"></span>現在的位置</div><div class="legend">${[["wc","洗手間",24],["tea","茶水間",24],["st","樓梯／電梯",30]].map(([k,t,w])=>`<svg class="li" viewBox="${-w} -16 ${w*2} 32" width="${w*0.7}" height="22" aria-hidden="true">${ICON[k](0,0)}</svg>${t}`).join("")}</div>`;$("floor").dataset.built=1}
 document.querySelectorAll("#floor .r").forEach(g=>{const r=g.dataset.r;g.setAttribute("class","r"+(on.includes(r)?" on":USED.includes(r)?" use":"")+(r?"":" blank"))});
}
// 一般行程名稱照官方「實地訪評行程」圖
const GEN=["訪評委員到校","訪評委員預備會議","相互介紹、受評單位簡報","受評單位主管晤談","教學設施參訪","午餐","資料檢閱與交流","教師與行政人員代表晤談","學生代表晤談","彈性時間","畢業生代表座談","訪評委員討論會議","綜合座談","訪評委員綜合討論會議","完成實地訪評報告"];
function renderGeneral(n,blk0){
 const B=BLOCKS.slice(1).map((b,i)=>[b[0],b[1],GEN[i],b[3]]);
 const blk=blk0&&blk0!==BLOCKS[0]?B[BLOCKS.indexOf(blk0)-1]:null;
 let h=`<h2>現在進行<em>訪評行程</em></h2>`;
 if(blk){
  h+=`<div class="seal" aria-hidden="true"><b>進行中</b><i>${blk===B[B.length-1]?blk[0]+" 起":"至 "+blk[1]}</i></div><div class="multi"><table class="form">
  <tr><th>項目</th><td><div class="place sm">${blk[2]}</div></td></tr>
  <tr><th>時間</th><td>${blk===B[B.length-1]?`<span class="when">${blk[0]} 起</span>`:`<span class="when">${blk[0]}–${blk[1]}</span>　<span class="left">剩 ${dur(m(blk[1])-n)}</span>`}</td></tr>
  ${blk[3]?`<tr><th>地點</th><td class="txt">${blk[3]}</td></tr>`:""}</table></div>`;
 } else if(n>=m(B[B.length-1][1])) h+=`<div class="idle">今天的訪評行程結束了，大家辛苦了！</div>`;
 else h+=`<div class="idle">訪評委員 09:30 到校，請師長 09:00 前到 D308 簽到。</div>`;
 $("now").innerHTML=h;
 const nb=B.find(b=>m(b[0])>n);
 $("next").innerHTML=nb?`<h2>下一項<em>${nb[0]} 開始，再 ${dur(m(nb[0])-n)}</em></h2><table class="form"><tr><th>項目</th><td><div class="place sm">${nb[2]}</div></td></tr><tr><th>時間</th><td><span class="when">${nb[0]}–${nb[1]}</span></td></tr>${nb[3]?`<tr><th>地點</th><td class="txt">${nb[3]}</td></tr>`:""}</table>`:`<h2>下一項</h2><div class="idle">沒有後續行程了。</div>`;
 $("dayTitle").textContent="實地訪評行程";
 $("day").innerHTML=B.map(b=>{const s=m(b[0]),e=m(b[1]);const cls=n>=e?"done":(n>=s?"cur":"");
  const chop=cls==="done"?'<span class="chop">已辦</span>':cls==="cur"?'<span class="chop now">進行中</span>':"";
  return `<tr class="${cls}"><td class="t">${b[0]}<span>${b===B[B.length-1]?"起":b[1]}</span></td><td><div class="bn">${b[2]}${chop}</div>${b[3]?`<div class="bl">${b[3]}</div>`:""}</td></tr>`}).join("");
 drawFloor(blk?blk[3]:"");
}
render();
setInterval(()=>{if(live)render()},15000);
</script>
</body>
</html>
